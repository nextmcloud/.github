#
# Build non-forked, self-developed app with the same mechanism
# as MagentaCLOUD customized apps

name: MCLOUD build (app)

on:
  workflow_call:
    inputs:
      branch:
        description: name of the (stable) branch to build app from
        required: false
        type: string
      appname:
        description: name of the app to pack
        required: true
        type: string
      tag:
        description: tag to use for the release
        required: true
        type: string
      prerelease:
        description: mark the package as pre-release
        required: false
        type: boolean
        default: false

env:
  CUSTOM_SERVER_EXCLUDES: |
    /build/
    /node_modules/
    /contribute/
    /config/
    /src/**/*.js
    /.devcontainer/
    /.github/
    /.idea/
    /.tx/
    /.*
    /composer.*
    package.json
    package-lock.json
    stylelint.*
    babel.*
    webpack.*
    krankerl.toml

  CUSTOM_TEST_EXCLUDES: |
    **/tests/
    **/cypress/
    /cypress*.ts
    /jest.config.ts

jobs:
  build-app:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PHP_VERSION: ${{ vars.PHP_VERSION || '8.1' }}
      JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
      JFROG_EMAIL: ${{ secrets.JFROG_EMAIL }}
      npm_config_optional: true

    steps:
      - name: Fetch stable branch
        id: checkout_branch
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.BUILD_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Validate app name
        shell: bash
        env:
          APPNAME: ${{ inputs.appname }}
        run: |
          set -euo pipefail
      
          if [[ ! "${APPNAME}" =~ ^[a-z0-9_]+$ ]]; then
            echo "::error::Invalid Nextcloud app ID: ${APPNAME}"
            exit 1
          fi

      - name: Verify checkout contains no persisted credential
        run: |
          set -euo pipefail
      
          if git config --local --get-regexp '^http\..*\.extraheader$' >/dev/null 2>&1; then
            echo "::error::Persisted Git credential found in repository configuration"
            exit 1
          fi
      
      - name: Resolve checked out commit
        id: checked_out_commit
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # install php dependencies
      - name: Set up php ${{ env.PHP_VERSION }}
        if: ${{ hashFiles('composer.json') != '' }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      
      - name: Install composer dependencies
        if: ${{ hashFiles('composer.json') != '' }}
        run: composer install --no-dev --no-interaction --prefer-dist

      # the node.js, npm install procedure is taken over from upstream Nextcloud
      # command-compile.yml
      - name: Detect NC compatible node.js,npm
        if: ${{ hashFiles('package.json') != '' }}
        uses: skjnldsv/read-package-engines-version-actions@v3
        id: package-engines-versions
        with:
          fallbackNode: '^20'
          fallbackNpm: '^10'

      - name: Set up node ${{ steps.package-engines-versions.outputs.nodeVersion }}
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.package-engines-versions.outputs.nodeVersion }}
          cache: npm

      - name: Set up npm ${{ steps.package-engines-versions.outputs.npmVersion }}
        if: ${{ hashFiles('package.json') != '' }}
        run: npm install -g npm@"${{ steps.package-engines-versions.outputs.npmVersion }}"

      - name: Build composer dependencies, sass, webpacks
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          rm -rf node_modules
          npm ci --include=optional --no-audit --no-fund
          npm run build --if-present

      # TODO: check whether we have to generate css from scss for server at all
      # TODO: check whether we have to generate icons (default.css) from scss for server at all
      # (could be only required for theme build)

      # either default ignores or listed in .nextcloudignore
      - name: Clean files
        env:
          CUSTOM_EXCLUDES: |
            ${{ env.CUSTOM_SERVER_EXCLUDES }}
            ${{ env.CUSTOM_TEST_EXCLUDES }}
        shell: bash
        run: |
          set -euo pipefail

          printf '%s\n' "$CUSTOM_EXCLUDES" > "${RUNNER_TEMP}/.distignore"

          if [ -f "./.nextcloudignore" ]; then
            cat ./.nextcloudignore >> "${RUNNER_TEMP}/.distignore"
          fi

          git ls-files -z \
            --cached \
            --others \
            --ignored \
            --exclude-from="${RUNNER_TEMP}/.distignore" \
            | xargs -0 -r rm -f --

      - name: Create clean app package
        id: package_app
        shell: bash
        run: |
          set -euo pipefail
      
          PACKAGE_ROOT="${RUNNER_TEMP}/package"
          PACKAGE_DIR="${PACKAGE_ROOT}/${{ inputs.appname }}"
      
          rm -rf "${PACKAGE_ROOT}"
          mkdir -p "${PACKAGE_DIR}"
      
          rsync -a \
            --exclude='/.git' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.gitignore' \
            --exclude='/.gitattributes' \
            --exclude='/.nextcloudignore' \
            ./ "${PACKAGE_DIR}/"

      - name: Verify clean app package
        shell: bash
        run: |
          set -euo pipefail
      
          PACKAGE_DIR="${RUNNER_TEMP}/package/${{ inputs.appname }}"
      
          echo "Checking release directory: ${PACKAGE_DIR}"
      
          if find "${PACKAGE_DIR}" -name '.git' -print -quit | grep -q .; then
            echo "::error::.git directory found in release package"
            exit 1
          fi
      
          if find "${PACKAGE_DIR}" \
            \( -name '.gitignore' \
               -o -name '.gitattributes' \
               -o -name '.nextcloudignore' \) \
            -print -quit | grep -q .; then
            echo "::error::Git/development metadata found in release package"
            exit 1
          fi

      - name: Scan package for leaked Git credentials
        shell: bash
        run: |
          set -euo pipefail
      
          PACKAGE_DIR="${RUNNER_TEMP}/package/${{ inputs.appname }}"
      
          if grep -RIlEi \
            'authorization:[[:space:]]*basic|x-access-token:|gh[pousr]_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+' \
            "${PACKAGE_DIR}" >/dev/null 2>&1; then
            echo "::error::Potential GitHub credential found in release package"
            exit 1
          fi

      - name: Pack app version
        shell: bash
        run: |
          set -euo pipefail
      
          tar \
            -C "${RUNNER_TEMP}/package" \
            -czf "${RUNNER_TEMP}/${{ inputs.appname }}.tar.gz" \
            "${{ inputs.appname }}"

      - name: Verify final archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="${RUNNER_TEMP}/${{ inputs.appname }}.tar.gz"
          CONTENTS="${RUNNER_TEMP}/archive-contents.txt"

          tar -tzf "${ARCHIVE}" > "${CONTENTS}"

          if grep -Eq '(^|/)\.git(/|$)' "${CONTENTS}"; then
            echo "::error::.git found inside final release archive"
            exit 1
          fi

          if grep -Eq '(^|/)\.(gitignore|gitattributes|nextcloudignore)$' "${CONTENTS}"; then
            echo "::error::Development metadata found inside final release archive"
            exit 1
          fi

          echo "Release archive verification successful."

      - name: Verify release tag does not exist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BUILD_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
      
          if gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
            >/dev/null 2>&1; then
            echo "::error::Git tag ${RELEASE_TAG} already exists"
            exit 1
          fi

      - name: Create draft GitHub release
        id: create_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BUILD_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          APPNAME: ${{ inputs.appname }}
          COMMIT_SHA: ${{ steps.checked_out_commit.outputs.sha }}
        run: |
          set -euo pipefail
      
          gh release create "${RELEASE_TAG}" \
            --draft \
            --title "${RELEASE_TAG}" \
            --target "${COMMIT_SHA}" \
            --notes "Update for MagentaCloud regular app ${APPNAME}"
      
      - name: Upload app package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BUILD_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          APPNAME: ${{ inputs.appname }}
        run: |
          set -euo pipefail
      
          gh release upload \
            "${RELEASE_TAG}" \
            "${RUNNER_TEMP}/${APPNAME}.tar.gz"
      
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BUILD_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
      
          ARGS=(
            "${RELEASE_TAG}"
            --draft=false
          )
      
          if [ "${PRERELEASE}" = "true" ]; then
            ARGS+=(--prerelease)
          fi
      
          gh release edit "${ARGS[@]}"

      - name: Post-failure cleanup
        if: ${{ failure() && steps.create_release.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BUILD_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set +e

          IS_DRAFT="$(gh release view "${RELEASE_TAG}" \
            --json isDraft \
            --jq '.isDraft' 2>/dev/null)"

          if [ "${IS_DRAFT}" = "true" ]; then
            echo "Removing draft release and tag created by this workflow run: ${RELEASE_TAG}"

            gh release delete \
              "${RELEASE_TAG}" \
              --cleanup-tag \
              --yes
          else
            echo "Release is not a draft or could not be found; skipping cleanup."
          fi
