###
# SPDX-License-Identifier: AGPL-3.0
#
# Author: Mauro Mura <mauro-efisio.mura@t-systems.com>
#
# Find all approved open customisation PRs on a selected source baseline
# and create corresponding customisation branches and PRs for another
# target baseline.
#
# Instead of replaying the complete customisation history using rebase,
# the final customisation diff is extracted from the source branch and
# applied as a single patch onto a fresh target branch.
#
# This avoids replaying unrelated upstream changes between baselines and
# significantly reduces conflicts when porting customisations across
# multiple Nextcloud versions.
#
# Supported use cases include:
#
#   master      -> stable-33.0
#   master      -> stable-34.0
#   stable-33.0 -> stable-34.0
#   stable-33.0 -> stable-35.0
#   stable-34.0 -> stable-35.0
#   stable-35.0 -> master
#
# Stable targets use:
#
#   backport/nmc/<custom-id>/<stable-branch>
#
# Non-stable targets use:
#
#   custom/nmc/<custom-id>/<target-branch>
#
# When the source is already a generated backport/custom branch,
# the original customisation ID is preserved.
#
###

name: MCLOUD custom baseline port

on:
  workflow_call:
    inputs:
      source:
        description: Base branch containing the source customisations
        required: true
        type: string

      target:
        description: Base branch to create the customisations for
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  create-custom-ports:
    runs-on: ubuntu-latest

    env:
      CUSTOM_REPO: ${{ github.repository }}
      SOURCE_BASE: ${{ inputs.source }}
      TARGET_BASE: ${{ inputs.target }}

      BUILD_USER: ${{ github.actor }}
      BUILD_EMAIL: ${{ github.actor }}@users.noreply.github.com
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$SOURCE_BASE" == "$TARGET_BASE" ]]; then
            echo "::error::Source and target branch must be different."
            exit 1
          fi

          echo "Source baseline: $SOURCE_BASE"
          echo "Target baseline: $TARGET_BASE"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Prepare repository
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "$BUILD_USER"
          git config user.email "$BUILD_EMAIL"

          git config merge.verbosity 1
          git config advice.skippedCherryPicks false

          # Make all remote branches available locally.
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'

          if ! git show-ref --verify --quiet "refs/remotes/origin/$SOURCE_BASE"; then
            echo "::error::Source branch '$SOURCE_BASE' does not exist."
            exit 1
          fi

          if ! git show-ref --verify --quiet "refs/remotes/origin/$TARGET_BASE"; then
            echo "::error::Target branch '$TARGET_BASE' does not exist."
            exit 1
          fi

      - name: Find source customisations
        id: source-customisations
        shell: bash
        run: |
          set -euo pipefail

          pulls="$(
            gh pr list \
              --repo "$CUSTOM_REPO" \
              --state open \
              --base "$SOURCE_BASE" \
              --label custom \
              --label approved \
              --limit 100 \
              --json number,title,baseRefName,headRefName,isDraft,url
          )"

          echo "$pulls" > "$RUNNER_TEMP/source-customisations.json"

          count="$(
            echo "$pulls" |
              jq '[.[] | select(.isDraft == false)] | length'
          )"

          echo "Found $count approved customisation PR(s) on $SOURCE_BASE"

          {
            echo "## Customisation port"
            echo
            echo "**Source:** \`$SOURCE_BASE\`"
            echo
            echo "**Target:** \`$TARGET_BASE\`"
            echo
            echo "**Customisations:** $count"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create target branches
        id: create-branches
        shell: bash
        run: |
          set -euo pipefail

          pulls="$(cat "$RUNNER_TEMP/source-customisations.json")"
          failed=0

          mkdir -p "$RUNNER_TEMP/custom-patches"

          while IFS= read -r pr; do
            prnr="$(echo "$pr" | jq -r '.number')"
            title="$(echo "$pr" | jq -r '.title')"
            prbranch="$(echo "$pr" | jq -r '.headRefName')"
            sourcebase="$(echo "$pr" | jq -r '.baseRefName')"

            #
            # Determine the original customisation ID.
            #
            # For normal customisations this is the source PR number.
            #
            # If the source itself is already a generated backport/custom
            # branch, preserve the original customisation ID.
            #
            custom_id="$prnr"

            if [[ "$prbranch" =~ ^backport/nmc/([^/]+)/ ]]; then
              custom_id="${BASH_REMATCH[1]}"
            elif [[ "$prbranch" =~ ^custom/nmc/([^/]+)/ ]]; then
              custom_id="${BASH_REMATCH[1]}"
            fi

            #
            # Determine the target branch name.
            #
            if [[ "$TARGET_BASE" == stable-* ]]; then
              copybranch="backport/nmc/${custom_id}/${TARGET_BASE}"
            else
              copybranch="custom/nmc/${custom_id}/${TARGET_BASE}"
            fi

            echo
            echo "============================================================"
            echo "Source PR:     #$prnr"
            echo "Custom ID:     $custom_id"
            echo "Source base:   $sourcebase"
            echo "Source branch: $prbranch"
            echo "Target base:   $TARGET_BASE"
            echo "Target branch: $copybranch"
            echo "============================================================"

            #
            # Verify that the source branch exists.
            #
            if ! git show-ref \
              --verify \
              --quiet \
              "refs/remotes/origin/$prbranch"
            then
              echo "::error::Source branch '$prbranch' does not exist."
              ((failed+=1))
              continue
            fi

            #
            # Keep existing target branches untouched.
            #
            # This allows manually resolved target branches to survive
            # subsequent workflow runs. A missing PR will still be created
            # in the next step.
            #
            if git ls-remote \
              --exit-code \
              --heads \
              origin \
              "$copybranch" >/dev/null 2>&1
            then
              echo "::info::Keep existing $copybranch untouched"

              git fetch origin \
                "+refs/heads/$copybranch:refs/remotes/origin/$copybranch"

              echo ":information_source: Existing \`${copybranch}\` kept untouched" \
                >> "$GITHUB_STEP_SUMMARY"

              continue
            fi

            #
            # Determine the actual fork point of the source customisation.
            #
            # The final customisation diff will be calculated from this
            # point to the current source custom branch.
            #
            if ! fork_point="$(
              git merge-base \
                "origin/$sourcebase" \
                "origin/$prbranch"
            )"
            then
              echo "::error::Could not determine fork point for $prbranch"
              ((failed+=1))
              continue
            fi

            if [[ -z "$fork_point" ]]; then
              echo "::error::Could not determine fork point for $prbranch"
              ((failed+=1))
              continue
            fi

            echo "Fork point: $fork_point"

            #
            # Check whether the source customisation actually contains
            # any changes compared to its source baseline.
            #
            if git diff \
              --quiet \
              "$fork_point" \
              "origin/$prbranch"
            then
              echo "::info::Source customisation #$custom_id contains no changes"

              echo ":fast_forward: Customisation #${custom_id} contains no source changes" \
                >> "$GITHUB_STEP_SUMMARY"

              continue
            fi

            #
            # Extract only the final customisation diff.
            #
            # --binary:
            #   Include binary files such as icons and images.
            #
            # --full-index:
            #   Include complete blob hashes, allowing git apply --3way
            #   to reconstruct the original blobs and perform a proper
            #   three-way merge where possible.
            #
            patch_file="$RUNNER_TEMP/custom-patches/custom-${custom_id}.patch"

            git diff \
              --binary \
              --full-index \
              "$fork_point" \
              "origin/$prbranch" \
              > "$patch_file"

            echo
            echo "Customisation diff:"
            git diff \
              --stat \
              "$fork_point" \
              "origin/$prbranch"

            #
            # Always create the target branch directly from the selected
            # target baseline.
            #
            # No source history is carried over.
            #
            git checkout --detach "origin/$TARGET_BASE"

            git branch -D "$copybranch" 2>/dev/null || true

            git checkout \
              -b "$copybranch" \
              "origin/$TARGET_BASE"

            #
            # Check whether the exact customisation is already present
            # in the target baseline.
            #
            # If the patch can be cleanly reversed on the target, the
            # customisation has already been applied there.
            #
            if git apply \
              --reverse \
              --check \
              "$patch_file" >/dev/null 2>&1
            then
              echo "::info::Customisation #$custom_id is already contained in $TARGET_BASE"

              echo ":fast_forward: Customisation #${custom_id} already contained in \`${TARGET_BASE}\`" \
                >> "$GITHUB_STEP_SUMMARY"

              git checkout --detach "origin/$TARGET_BASE"
              git branch -D "$copybranch"

              continue
            fi

            #
            # Apply the complete final customisation as one patch.
            #
            # --3way lets Git fall back to a three-way merge if the exact
            # patch context changed between source and target.
            #
            # --index makes successful changes directly available for the
            # single squashed port commit.
            #
            if git apply \
              --3way \
              --index \
              "$patch_file"
            then
              #
              # Nothing staged means the target already contains an
              # equivalent result.
              #
              if git diff --cached --quiet; then
                echo "::info::Customisation #$custom_id produces no changes on $TARGET_BASE"

                echo ":fast_forward: Customisation #${custom_id} produces no changes on \`${TARGET_BASE}\`" \
                  >> "$GITHUB_STEP_SUMMARY"

                git checkout --detach "origin/$TARGET_BASE"
                git branch -D "$copybranch"

                continue
              fi

              clean_title="$(
                echo "$title" |
                  sed -E 's/^(\[[^]]+\][[:space:]]*)+//'
              )"

              #
              # Commit the port as a single squashed customisation commit.
              #
              if [[ "$TARGET_BASE" == stable-* ]]; then
                commit_title="[${TARGET_BASE}] ${clean_title}"
              else
                commit_title="${clean_title}"
              fi

              git commit \
                -m "$commit_title" \
                -m "Ported from ${prbranch} (${sourcebase})."

              git push \
                -u \
                origin \
                "$copybranch"

              echo ":white_check_mark: \`${prbranch}\` → \`${copybranch}\`" \
                >> "$GITHUB_STEP_SUMMARY"

            else
              #
              # The final customisation diff could not be applied cleanly.
              #
              # These conflicts represent actual differences between the
              # customisation and the target baseline rather than conflicts
              # caused by replaying the complete source history.
              #
              echo "::error::PATCH conflict: $prbranch -> $copybranch"

              conflicted_files="$(
                git diff \
                  --name-only \
                  --diff-filter=U || true
              )"

              if [[ -n "$conflicted_files" ]]; then
                echo
                echo "Conflicting files:"
                echo "$conflicted_files"
              fi

              echo
              echo "Conflict details:"
              git diff --cc || true

              {
                echo ":no_entry_sign: \`${prbranch}\` → \`${copybranch}\` has patch conflicts"

                if [[ -n "$conflicted_files" ]]; then
                  echo
                  echo "Conflicting files:"
                  echo '```'
                  echo "$conflicted_files"
                  echo '```'
                fi
              } >> "$GITHUB_STEP_SUMMARY"

              #
              # Restore a clean repository for the next customisation.
              #
              git reset --hard "origin/$TARGET_BASE"
              git clean -fd

              git checkout --detach "origin/$TARGET_BASE"
              git branch -D "$copybranch" || true

              ((failed+=1))
            fi

          done < <(
            echo "$pulls" |
              jq -c '.[] | select(.isDraft == false)'
          )

          if (( failed > 0 )); then
            echo "::error::$failed customisation(s) could not be ported."
            exit 1
          fi

      - name: Create missing target PRs
        if: ${{ always() && steps.source-customisations.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail

          pulls="$(cat "$RUNNER_TEMP/source-customisations.json")"
          failed=0

          #
          # Make sure remote tracking branches created by the previous
          # step are available even if that step ended with conflicts for
          # other customisations.
          #
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'

          while IFS= read -r pr; do
            title="$(echo "$pr" | jq -r '.title')"
            prnr="$(echo "$pr" | jq -r '.number')"
            url="$(echo "$pr" | jq -r '.url')"
            prbranch="$(echo "$pr" | jq -r '.headRefName')"

            #
            # Determine original customisation ID.
            #
            custom_id="$prnr"

            if [[ "$prbranch" =~ ^backport/nmc/([^/]+)/ ]]; then
              custom_id="${BASH_REMATCH[1]}"
            elif [[ "$prbranch" =~ ^custom/nmc/([^/]+)/ ]]; then
              custom_id="${BASH_REMATCH[1]}"
            fi

            #
            # Determine target branch name.
            #
            if [[ "$TARGET_BASE" == stable-* ]]; then
              copybranch="backport/nmc/${custom_id}/${TARGET_BASE}"
            else
              copybranch="custom/nmc/${custom_id}/${TARGET_BASE}"
            fi

            #
            # Skip if no target branch is available.
            #
            # This includes customisations where automatic patch
            # application failed and manual porting is required.
            #
            if ! git ls-remote \
              --exit-code \
              --heads \
              origin \
              "$copybranch" >/dev/null 2>&1
            then
              echo "::info::No $copybranch available, skip PR creation"
              continue
            fi

            git fetch origin \
              "+refs/heads/$copybranch:refs/remotes/origin/$copybranch"

            #
            # Skip branches without changes compared to the target.
            #
            if git diff \
              --quiet \
              "origin/$TARGET_BASE" \
              "origin/$copybranch"
            then
              echo "::info::$copybranch contains no changes compared to $TARGET_BASE"
              continue
            fi

            #
            # Skip if an open PR already exists.
            #
            existing_pr="$(
              gh pr list \
                --repo "$CUSTOM_REPO" \
                --state open \
                --base "$TARGET_BASE" \
                --head "$copybranch" \
                --json number \
                --jq '.[0].number // empty'
            )"

            if [[ -n "$existing_pr" ]]; then
              echo "::info::Existing PR #$existing_pr for $copybranch"
              continue
            fi

            #
            # Remove previous baseline prefixes such as:
            #
            #   [stable-33.0] My customisation
            #
            clean_title="$(
              echo "$title" |
                sed -E 's/^(\[[^]]+\][[:space:]]*)+//'
            )"

            #
            # Stable PRs retain the established title format.
            #
            if [[ "$TARGET_BASE" == stable-* ]]; then
              target_title="[${TARGET_BASE}] ${clean_title}"
            else
              target_title="${clean_title}"
            fi

            printf -v target_body \
              '__%s baseline for__\n\n__[#%s %s](%s)__\n\nSource baseline: `%s`\n\nSource branch: `%s`\n' \
              "$TARGET_BASE" \
              "$prnr" \
              "$clean_title" \
              "$url" \
              "$SOURCE_BASE" \
              "$prbranch"

            if gh pr create \
              --repo "$CUSTOM_REPO" \
              --title "$target_title" \
              --body "$target_body" \
              --base "$TARGET_BASE" \
              --head "$copybranch" \
              --label custom
            then
              echo ":white_check_mark: PR created: \`${copybranch}\` → \`${TARGET_BASE}\`" \
                >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Could not create PR for $copybranch"
              ((failed+=1))
            fi

          done < <(
            echo "$pulls" |
              jq -c '.[] | select(.isDraft == false)'
          )

          if (( failed > 0 )); then
            echo "::error::$failed PR(s) could not be created."
            exit 1
          fi
