name: MCLOUD rebase custom branches

on:
  workflow_call:
    inputs:
      branch_type:
        description: 'Select which branches to rebase'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  rebase:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Fetch all branches
        run: git fetch --all --prune

      - name: Find matching PR branches with approved label
        id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TYPE="${{ inputs.branch_type }}"

          if [[ "$TYPE" == "master" ]]; then
            REGEX="^nmc/master"
            TARGET="origin/master"
          else
            REGEX="${TYPE//./\\.}"
            TARGET="origin/$TYPE"
          fi

          echo "Searching open PRs for branch regex: $REGEX"
          echo "Target: $TARGET"

          MATCHED_BRANCHES=$(gh pr list \
            --state open \
            --limit 200 \
            --json headRefName,labels \
            | jq -r --arg regex "$REGEX" '
                .[]
                | select(.headRefName | test($regex))
                | select(any(.labels[].name; . == "approved"))
                | .headRefName
              ')

          echo "Matched branches:"
          echo "$MATCHED_BRANCHES"

          if [[ -z "$MATCHED_BRANCHES" ]]; then
            echo "No approved PR branches found for $TYPE, exiting"
            exit 0
          fi

          {
            echo "branches<<EOF"
            echo "$MATCHED_BRANCHES"
            echo "EOF"
            echo "target=$TARGET"
          } >> "$GITHUB_OUTPUT"

      - name: Rebase approved PR branches
        run: |
          while IFS= read -r BRANCH; do
            [[ -z "$BRANCH" ]] && continue

            echo "Rebasing $BRANCH onto ${{ steps.filter.outputs.target }}"

            git checkout -B "$BRANCH" "origin/$BRANCH"

            if git rebase "${{ steps.filter.outputs.target }}"; then
              git push --force-with-lease origin "$BRANCH"
            else
              echo "Conflict in $BRANCH, aborting rebase"
              git rebase --abort
            fi
          done <<< "${{ steps.filter.outputs.branches }}"
